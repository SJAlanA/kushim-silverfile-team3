<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sessions{% endblock %} · Kushim SilverFile</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <a class="brand" href="{{ url_for('sessions') }}">Kushim SilverFile</a>
      <nav aria-label="Main">
        <a href="{{ url_for('sessions') }}" {% if request.endpoint == 'sessions' %}aria-current="page"{% endif %}>Sessions</a>
        <a href="{{ url_for('queue') }}" {% if request.endpoint == 'queue' %}aria-current="page"{% endif %}>Waiting for review</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="notice notice-{{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
